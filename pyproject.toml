[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pde-jepa"
version = "0.1.0"
description = "Predictive representations, physics-aligned geometry, and structured latent dynamics for PDEs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.4", "numpy", "h5py", "PyYAML", "einops"]

[project.optional-dependencies]
logging = ["wandb"]

[tool.setuptools.packages.find]
include = ["pde_jepa*"]
